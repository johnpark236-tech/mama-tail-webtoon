<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>엄마 꼬리 🐾</title>
<style>
/* ── 리셋 & 기본 ── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Noto Serif KR', 'Malgun Gothic', serif;
  background: #0a0a0a;
  color: #ddd;
  overflow-x: hidden;
}

/* ── 화면 전환 ── */
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }

/* ══════════════════════════════
   타이틀 화면
══════════════════════════════ */
#title-screen {
  background: linear-gradient(180deg, #0a0a0a 0%, #1a0800 50%, #0a0a0a 100%);
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 40px 20px;
  min-height: 100vh;
}
.title-paw {
  font-size: 72px;
  animation: pulse 2.5s ease-in-out infinite;
  display: block;
  margin-bottom: 20px;
}
@keyframes pulse {
  0%, 100% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.12); opacity: 0.85; }
}
.title-main {
  font-size: clamp(36px, 8vw, 64px);
  font-weight: 900;
  color: #f5c842;
  letter-spacing: 4px;
  text-shadow: 0 0 40px rgba(245,200,66,0.4);
  margin-bottom: 12px;
}
.title-sub {
  font-size: clamp(14px, 3vw, 18px);
  color: #c8a060;
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.title-desc {
  font-size: clamp(12px, 2.5vw, 15px);
  color: #888;
  margin-bottom: 48px;
  max-width: 400px;
}
.mode-btns {
  display: flex;
  gap: 20px;
  justify-content: center;
  flex-wrap: wrap;
  width: 100%;
  max-width: 600px;
}
.mode-btn {
  flex: 1;
  min-width: 220px;
  max-width: 280px;
  padding: 28px 20px;
  border-radius: 16px;
  cursor: pointer;
  text-align: center;
  transition: transform 0.25s, box-shadow 0.25s;
  text-decoration: none;
}
.mode-btn:hover { transform: translateY(-4px); }
.mode-btn .btn-icon { font-size: 40px; display: block; margin-bottom: 10px; }
.mode-btn .btn-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
.mode-btn .btn-desc  { font-size: 13px; opacity: 0.8; }
.btn-webtoon {
  border: 2px solid #f5c842;
  background: transparent;
  color: #f5c842;
}
.btn-webtoon:hover { box-shadow: 0 8px 32px rgba(245,200,66,0.25); }
.btn-audio {
  background: linear-gradient(135deg, #f5c842, #e8a020);
  color: #111;
  border: none;
}
.btn-audio:hover { box-shadow: 0 8px 32px rgba(245,200,66,0.4); }

/* ══════════════════════════════
   공통 헤더
══════════════════════════════ */
.viewer-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid #222;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
}
.btn-home {
  background: none;
  border: 1px solid #444;
  color: #aaa;
  padding: 6px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  white-space: nowrap;
  transition: all 0.2s;
}
.btn-home:hover { border-color: #f5c842; color: #f5c842; }
.header-title {
  font-size: 15px;
  font-weight: 700;
  color: #f5c842;
  flex: 1;
}
.header-progress {
  font-size: 13px;
  color: #888;
  white-space: nowrap;
}

/* ══════════════════════════════
   웹툰 모드
══════════════════════════════ */
#webtoon-screen { background: #111; }
.webtoon-scroll {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 0 80px;
}
.scene-block {
  margin-bottom: 4px;
}
.scene-img {
  width: 100%;
  display: block;
  background: #1a1a1a;
}
.scene-img img {
  width: 100%;
  height: auto;
  display: block;
}
.scene-subs {
  background: #141414;
  padding: 16px 20px;
  border-bottom: 1px solid #222;
}
.scene-num {
  font-size: 11px;
  color: #555;
  margin-bottom: 8px;
  font-family: monospace;
}
.scene-line {
  font-size: 16px;
  color: #ddd;
  line-height: 1.75;
  padding: 2px 0;
}
.scene-empty {
  font-size: 13px;
  color: #444;
  font-style: italic;
}
/* 웹툰 하단 네비 */
.webtoon-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.95);
  backdrop-filter: blur(8px);
  border-top: 1px solid #222;
  display: flex;
  justify-content: center;
  gap: 12px;
  padding: 10px 16px;
  z-index: 100;
}
.nav-btn {
  background: #1e1e1e;
  border: 1px solid #333;
  color: #ccc;
  padding: 8px 24px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.2s;
}
.nav-btn:hover { background: #2a2a2a; border-color: #f5c842; color: #f5c842; }
.nav-btn:disabled { opacity: 0.3; cursor: default; }

/* ══════════════════════════════
   오디오북 모드
══════════════════════════════ */
#audiobook-screen { background: #0d0d0d; }

/* 오디오 바 */
.audio-bar {
  position: sticky;
  top: 57px;  /* 헤더 높이 */
  z-index: 90;
  background: rgba(15,15,15,0.97);
  border-bottom: 1px solid #1e1e1e;
  padding: 8px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.audio-play-btn {
  background: #f5c842;
  color: #111;
  border: none;
  width: 38px; height: 38px;
  border-radius: 50%;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: transform 0.15s;
}
.audio-play-btn:hover { transform: scale(1.1); }
.audio-time {
  font-size: 13px;
  color: #999;
  font-family: monospace;
  white-space: nowrap;
  flex-shrink: 0;
  min-width: 90px;
}
.audio-seek {
  flex: 1;
  height: 4px;
  appearance: none;
  background: #333;
  border-radius: 2px;
  cursor: pointer;
  outline: none;
}
.audio-seek::-webkit-slider-thumb {
  appearance: none;
  width: 14px; height: 14px;
  background: #f5c842;
  border-radius: 50%;
  cursor: pointer;
}
.audio-vol {
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  opacity: 0.7;
}
.audio-vol:hover { opacity: 1; }

/* 오디오북 이미지 뷰어 */
.ab-scroll {
  max-width: 800px;
  margin: 0 auto;
  padding: 0 0 120px;
}
.ab-scene {
  margin-bottom: 2px;
}
.ab-scene img {
  width: 100%;
  height: auto;
  display: block;
}
/* 자막 오버레이 */
#subtitle-overlay {
  position: fixed;
  bottom: 56px;
  left: 0; right: 0;
  z-index: 80;
  pointer-events: none;
  text-align: center;
  padding: 0 16px;
  transition: opacity 0.3s;
}
.subtitle-inner {
  display: inline-block;
  background: rgba(0,0,0,0.82);
  color: #fff;
  font-size: clamp(14px, 3.5vw, 18px);
  padding: 10px 24px;
  border-radius: 4px;
  max-width: 700px;
  line-height: 1.5;
}
/* 오디오북 하단 네비 */
.ab-nav {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10,10,10,0.95);
  border-top: 1px solid #1e1e1e;
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  z-index: 100;
}
.sync-btn {
  background: #2a2a3e;
  color: #a0aec0;
  border: 1px solid #4a4a6a;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 0.72rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.sync-btn:hover { background: #3a3a5a; color: #e2e8f0; }
.sync-btn:active { background: #4a4a6a; }
.save-btn {
  background: #1a3a2a;
  color: #68d391;
  border: 1px solid #48bb78;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 0.72rem;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.15s;
}
.save-btn:hover { background: #2a4a3a; }
#wt-sync-indicator {
  position: fixed;
  bottom: 52px; left: 50%; transform: translateX(-50%);
  background: rgba(245,200,66,0.15);
  color: #f5c842;
  border: 1px solid rgba(245,200,66,0.4);
  border-radius: 12px;
  padding: 3px 12px;
  font-size: 0.75rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 101;
}
#wt-sync-indicator.visible { opacity: 1; }
#sync-indicator {
  position: fixed;
  bottom: 52px; left: 50%; transform: translateX(-50%);
  background: rgba(245,200,66,0.15);
  color: #f5c842;
  border: 1px solid rgba(245,200,66,0.4);
  border-radius: 12px;
  padding: 3px 12px;
  font-size: 0.75rem;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 101;
}
#sync-indicator.visible { opacity: 1; }

/* ══════════════════════════════
   엔딩 카드
══════════════════════════════ */
.ending-card {
  background: linear-gradient(180deg, #0a0a0a, #150800);
  text-align: center;
  padding: 60px 24px 40px;
  margin-top: 4px;
}
.ending-paw { font-size: 52px; margin-bottom: 16px; display: block; }
.ending-title {
  font-size: clamp(20px, 5vw, 28px);
  color: #f5c842;
  font-weight: 700;
  margin-bottom: 10px;
}
.ending-sub { font-size: 16px; color: #c8a060; margin-bottom: 32px; }
.ending-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.ending-btn {
  padding: 12px 28px;
  border-radius: 10px;
  cursor: pointer;
  font-size: 15px;
  font-weight: 600;
  transition: transform 0.2s;
  border: none;
}
.ending-btn:hover { transform: translateY(-2px); }
.btn-restart { background: #f5c842; color: #111; }
.btn-home-end { background: #1e1e1e; color: #ccc; border: 1px solid #444; }

/* 로딩 스피너 */
.img-placeholder {
  background: #1a1a1a;
  min-height: 300px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #333;
  font-size: 24px;
}

@media (max-width: 600px) {
  .mode-btns { flex-direction: column; align-items: center; }
  .mode-btn { min-width: 280px; }
}
</style>
</head>
<body>

<!-- ══════════════════════════════
     1. 타이틀 화면
══════════════════════════════ -->
<div id="title-screen" class="screen active">
  <span class="title-paw">🐾</span>
  <h1 class="title-main">엄마 꼬리</h1>
  <p class="title-sub">사랑은 반드시 돌아옵니다</p>
  <p class="title-desc">다사랑 숲에서 전해오는 곰 가족의 이야기</p>
  <div class="mode-btns">
    <div class="mode-btn btn-webtoon" onclick="startWebtoon()">
      <span class="btn-icon">📖</span>
      <div class="btn-title">웹툰으로 보기</div>
      <div class="btn-desc">이미지 + 자막<br>(음성 없음)</div>
    </div>
    <div class="mode-btn btn-audio" onclick="startAudiobook()">
      <span class="btn-icon">🎧</span>
      <div class="btn-title">오디오북으로 듣기</div>
      <div class="btn-desc">이미지 + 자막 + 음성<br>(낭독 약 65분)</div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     2. 웹툰 모드
══════════════════════════════ -->
<div id="webtoon-screen" class="screen">
  <header class="viewer-header">
    <button class="btn-home" onclick="goHome()">← 홈</button>
    <span class="header-title">📖 웹툰 모드</span>
    <span class="header-progress" id="wt-progress">1 / 102</span>
  </header>

  <div class="webtoon-scroll" id="webtoon-container"></div>

  <nav class="webtoon-nav">
    <button class="sync-btn" onclick="adjustWtImgSync(-1)">이미지전</button>
    <button class="nav-btn" id="wt-prev" onclick="wtNav(-1)">◀ 이전</button>
    <button class="nav-btn" id="wt-next" onclick="wtNav(1)">다음 ▶</button>
    <button class="sync-btn" onclick="adjustWtImgSync(1)">이미지후</button>
    <button class="save-btn" onclick="saveImgSync()">💾 저장</button>
  </nav>
  <div id="wt-sync-indicator"></div>
</div>

<!-- ══════════════════════════════
     3. 오디오북 모드
══════════════════════════════ -->
<div id="audiobook-screen" class="screen">
  <header class="viewer-header">
    <button class="btn-home" onclick="goHome()">← 홈</button>
    <span class="header-title">🎧 오디오북 모드</span>
    <span class="header-progress" id="ab-progress">0 / 102</span>
  </header>

  <div class="audio-bar">
    <button class="audio-play-btn" id="play-btn" onclick="togglePlay()">▶</button>
    <span class="audio-time" id="audio-time">0:00 / 64:37</span>
    <input type="range" class="audio-seek" id="seek-bar"
           min="0" max="3877" value="0" step="1"
           oninput="seekTo(this.value)">
    <span class="audio-vol" id="vol-btn" onclick="toggleMute()">🔊</span>
  </div>

  <audio id="main-audio" src="audio.m4a" preload="metadata"></audio>

  <div class="ab-scroll" id="ab-container"></div>

  <div id="subtitle-overlay">
    <div class="subtitle-inner" id="sub-text"></div>
  </div>

  <nav class="ab-nav">
    <button class="sync-btn" id="ab-img-prev" onclick="adjustImgSync(-1)" title="이미지 1장 뒤로">이미지전</button>
    <button class="nav-btn" id="ab-prev" onclick="abNav(-1)">◀ 이전</button>
    <button class="nav-btn" id="ab-next" onclick="abNav(1)">다음 ▶</button>
    <button class="sync-btn" id="ab-img-next" onclick="adjustImgSync(1)" title="이미지 1장 앞으로">이미지후</button>
    <button class="save-btn" onclick="saveImgSync()">💾 저장</button>
  </nav>
  <div id="sync-indicator"></div>
</div>

<div id="back-popup-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:9998;align-items:center;justify-content:center;">
  <div style="background:#1e1e2e;border:1px solid #4a4a6a;border-radius:16px;padding:28px 28px 20px;max-width:300px;width:88%;text-align:center;">
    <div id="back-popup-msg" style="color:#e2e8f0;font-size:1rem;line-height:1.7;margin-bottom:20px;white-space:pre-line;"></div>
    <div style="display:flex;gap:12px;justify-content:center;">
      <button onclick="backPopupYes()" style="flex:1;background:#f5c842;color:#0a0a0a;border:none;border-radius:8px;padding:10px;font-size:0.95rem;font-weight:bold;cursor:pointer;">예</button>
      <button onclick="backPopupNo()"  style="flex:1;background:#2a2a3e;color:#a0aec0;border:1px solid #4a4a6a;border-radius:8px;padding:10px;font-size:0.95rem;cursor:pointer;">아니요</button>
    </div>
  </div>
</div>
<div id="save-popup-overlay" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#1e1e2e;border:1px solid #f5c842;border-radius:14px;padding:28px 32px;max-width:320px;width:90%;text-align:center;">
    <div id="save-popup-text" style="color:#e2e8f0;font-size:0.95rem;line-height:1.8;white-space:pre-line;"></div>
    <button onclick="document.getElementById('save-popup-overlay').style.display='none'" style="margin-top:18px;background:#f5c842;color:#0a0a0a;border:none;border-radius:8px;padding:8px 28px;font-size:0.9rem;cursor:pointer;font-weight:bold;">확인</button>
  </div>
</div>
<script>
// ══════════════════════════════════════════════════════════════════
// 데이터
// ══════════════════════════════════════════════════════════════════
const TOTAL_IMAGES    = 102;

const IMAGE_TIMELINE  = [30, 111, 120, 168, 190, 209, 229, 288, 291, 300, 306, 315, 339, 360, 377, 428, 468, 508, 543, 594, 633, 655, 675, 706, 743, 772, 795, 825, 834, 848, 884, 917, 959, 973, 1045, 1071, 1179, 1183, 1214, 1234, 1245, 1277, 1334, 1357, 1376, 1395, 1425, 1449, 1454, 1454, 1465, 1480, 1523, 1546, 1558, 1567, 1594, 1608, 1633, 1735, 1760, 1767, 1796, 1817, 1840, 1904, 1955, 1998, 2035, 2063, 2085, 2179, 2247, 2270, 2314, 2351, 2372, 2435, 2504, 2512, 2592, 2645, 2645, 2656, 2694, 2704, 2746, 2811, 2848, 3053, 3097, 3314, 3431, 3440, 3484, 3559, 3600, 3661, 3682, 3704, 3725, 3742]; // 이미지별 등장 시각(초)
