// 웹툰 모드
// ══════════════════════════════════════════════════════════════════
let wtPage = 1;
const WT_PAGE_SIZE = 10; // 한 번에 보여줄 씬 수
let wtImgOffset = 0;

function startWebtoon() {
  showScreen('webtoon-screen');
  history.pushState({screen:'webtoon'}, '');
  wtPage = 1;
  renderWebtoon();
  setupWtScrollObserver();
}

function setupWtScrollObserver() {
  const progressEl = document.getElementById('wt-progress');
  const obs = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const id = entry.target.id;
        const num = parseInt(id.replace('scene-', ''));
        if (progressEl) progressEl.textContent = num + ' / ' + TOTAL_IMAGES;
      }
    });
  }, { threshold: 0.3 });
  document.querySelectorAll('.scene-block').forEach(el => obs.observe(el));
}

function renderWebtoon() {
  const container = document.getElementById('webtoon-container');
  container.innerHTML = '';

  const start = 1;
  const end   = TOTAL_IMAGES;

  for (let i = start; i <= end; i++) {
    const block = document.createElement('div');
    block.className = 'scene-block';
    block.id = 'scene-' + i;

    const imgIdx = Math.max(1, Math.min(TOTAL_IMAGES, i + wtImgOffset));
    const imgNum = String(imgIdx).padStart(3, '0');
    const textsArr = IMAGE_SUBS[i] || [];

    let subsHtml = '';
    if (textsArr.length > 0) {
      subsHtml = textsArr.map(t => `<div class="scene-line">${t}</div>`).join('');
    } else {
      subsHtml = '<div class="scene-empty">[ 자막 없음 ]</div>';
    }

    block.innerHTML = `
      <div class="scene-img">
        <img src="images/${imgNum}.jpg"
             alt="씬 ${i}"
             loading="lazy"
             onerror="this.style.display='none'">
      </div>
      <div class="scene-subs">
        <div class="scene-num">씬 ${imgNum}</div>
        ${subsHtml}
      </div>`;
    container.appendChild(block);
  }

  // 엔딩 카드
  if (end === TOTAL_IMAGES) {
    container.appendChild(makeEndingCard('webtoon'));
  }

  document.getElementById('wt-progress').textContent =
    `${start}~${end} / ${TOTAL_IMAGES}`;
  document.getElementById('wt-prev').disabled = (wtPage === 1);
  document.getElementById('wt-next').disabled =
    (end === TOTAL_IMAGES);

  window.scrollTo(0, 0);
}

function wtNav(dir) {
  const scenes = document.querySelectorAll('.scene-block');
  let target = null;
  if (dir > 0) {
    for (let i = 0; i < scenes.length; i++) {
      if (scenes[i].getBoundingClientRect().top > 10) { target = scenes[i]; break; }
    }
  } else {
    for (let i = scenes.length - 1; i >= 0; i--) {
      if (scenes[i].getBoundingClientRect().top < -10) { target = scenes[i]; break; }
    }
  }
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ══════════════════════════════════════════════════════════════════
// 오디오북 모드
// ══════════════════════════════════════════════════════════════════
let abPage = 1;
const AB_PAGE_SIZE = 10;
let abCurrentImg = 1;
let isScrollingToImage = false;
let abImgOffset = 0;

function startAudiobook() {
  showScreen('audiobook-screen');
  history.pushState({screen:'audiobook'}, '');
  abPage = 1;
  abCurrentImg = 1;
  renderAudiobook();
}

function renderAudiobook() {
  const container = document.getElementById('ab-container');
  container.innerHTML = '';

  const start = (abPage - 1) * AB_PAGE_SIZE + 1;
  const end   = Math.min(abPage * AB_PAGE_SIZE, TOTAL_IMAGES);

  for (let i = start; i <= end; i++) {
    const block = document.createElement('div');
    block.className = 'ab-scene';
    block.id = 'ab-scene-' + i;

    const imgIdx = Math.max(1, Math.min(TOTAL_IMAGES, i + wtImgOffset));
    const imgNum = String(imgIdx).padStart(3, '0');
    block.innerHTML = `<img src="images/${imgNum}.jpg"
                            alt="씬 ${i}" loading="lazy"
                            onerror="this.style.display='none'">`;
    container.appendChild(block);
  }

  if (end === TOTAL_IMAGES) {
    container.appendChild(makeEndingCard('audiobook'));
  }

  document.getElementById('ab-progress').textContent =
    `${start}~${end} / ${TOTAL_IMAGES}`;
  document.getElementById('ab-prev').disabled = (abPage === 1);
  document.getElementById('ab-next').disabled = (end === TOTAL_IMAGES);

  window.scrollTo(0, 0);
}

function abNav(dir) {
  const maxPage = Math.ceil(TOTAL_IMAGES / AB_PAGE_SIZE);
  abPage = Math.max(1, Math.min(abPage + dir, maxPage));
  renderAudiobook();
}

// ── 오디오 제어 ──────────────────────────────────────────────────
const audio = document.getElementById('main-audio');

function togglePlay() {
  if (audio.paused) {
    audio.play();
    document.getElementById('play-btn').textContent = '⏸';
  } else {
    audio.pause();
    document.getElementById('play-btn').textContent = '▶';
  }
}

function seekTo(val) {
  audio.currentTime = parseFloat(val);
}

let muted = false;
function toggleMute() {
  muted = !muted;
  audio.muted = muted;
  document.getElementById('vol-btn').textContent = muted ? '🔇' : '🔊';
}

function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  return `${m}:${String(sec).padStart(2, '0')}`;
}

audio.addEventListener('timeupdate', () => {
  const ct = audio.currentTime;
  document.getElementById('seek-bar').value = ct;
  document.getElementById('audio-time').textContent =
    `${formatTime(ct)} / ${formatTime(TOTAL_DURATION)}`;

  updateSubtitle(ct);
  updateImageSync(ct);
});

audio.addEventListener('ended', () => {
  document.getElementById('play-btn').textContent = '▶';
});

// ── 자막 동기화 ──────────────────────────────────────────────────
let lastSubIdx = -1;

function updateSubtitle(ct) {
  let found = -1;
  for (let i = 0; i < SUBS.length; i++) {
    if (ct >= SUBS[i].start && ct < SUBS[i].end) {
      found = i;
      break;
    }
  }
  if (found === lastSubIdx) return;
  lastSubIdx = found;
  const overlay = document.getElementById('subtitle-overlay');
  const subText = document.getElementById('sub-text');
  if (found >= 0) {
    subText.textContent = SUBS[found].text;
    overlay.style.opacity = '1';
  } else {
    overlay.style.opacity = '0';
  }
}

// ── 이미지 싱크 수동 조정 ─────────────────────────────────────────
function adjustWtImgSync(delta) {
  wtImgOffset += delta;
  renderWebtoon();
  showSyncHint('wt', wtImgOffset);
}

function saveImgSync() {
  localStorage.setItem('wtImgOffset', String(wtImgOffset));
  localStorage.setItem('abImgOffset', String(abImgOffset));
  showSyncHint('wt', wtImgOffset);
  showSyncHint('ab', abImgOffset);
  var allSave = document.querySelectorAll('.save-btn');
  allSave.forEach(function(btn) {
    var orig = btn.textContent; btn.textContent = '✅ 저장됨';
    setTimeout(function() { btn.textContent = orig; }, 1500);
  });
  var wtTxt = wtImgOffset === 0 ? "기본값" : (wtImgOffset > 0 ? "+" : "") + wtImgOffset;
  var abTxt = abImgOffset === 0 ? "기본값" : (abImgOffset > 0 ? "+" : "") + abImgOffset;
  showSavePopup(
    "💾 싱크 저장 완료\n\n" +
    "📖 웹툰 이미지 싱크: " + wtTxt + "\n" +
    "🎧 오디오북 이미지 싱크: " + abTxt + "\n\n" +
    "다음 실행 시 자동으로 적용됩니다."
  );
}

function showSavePopup(msg) {
  var overlay = document.getElementById('save-popup-overlay');
  var text = document.getElementById('save-popup-text');
  if (!overlay || !text) return;
  text.textContent = msg;
  overlay.style.display = 'flex';
}

var backPopupCb = null;

function showBackPopup(msg, onYes) {
  backPopupCb = onYes;
  document.getElementById('back-popup-msg').textContent = msg;
  document.getElementById('back-popup-overlay').style.display = 'flex';
}

function backPopupYes() {
  document.getElementById('back-popup-overlay').style.display = 'none';
  if (backPopupCb) { var cb = backPopupCb; backPopupCb = null; cb(); }
}

function backPopupNo() {
  document.getElementById('back-popup-overlay').style.display = 'none';
  backPopupCb = null;
  history.pushState({screen: getCurrentScreen()}, '');
}

function getCurrentScreen() {
  if (document.getElementById('webtoon-screen').classList.contains('active')) return 'webtoon';
  if (document.getElementById('audiobook-screen').classList.contains('active')) return 'audiobook';
  return 'home';
}

function loadImgSync() {
  var wt = localStorage.getItem('wtImgOffset');
  var ab = localStorage.getItem('abImgOffset');
  if (wt !== null) wtImgOffset = parseInt(wt, 10);
  if (ab !== null) abImgOffset = parseInt(ab, 10);
}

function showSyncHint(mode, offset) {
  var id = mode === 'wt' ? 'wt-sync-indicator' : 'sync-indicator';
  var ind = document.getElementById(id);
  if (!ind) return;
  ind.textContent = offset === 0 ? '이미지 싱크 기본값' : '이미지 싱크 ' + (offset > 0 ? '+' : '') + offset;
  ind.classList.add('visible');
  clearTimeout(ind._t);
  ind._t = setTimeout(function() { ind.classList.remove('visible'); }, 2000);
}

function adjustImgSync(delta) {
  abImgOffset += delta;
  abCurrentImg = -1; // 강제 업데이트
  const audio = document.querySelector('audio');
  if (audio) updateImageSync(audio.currentTime);
  // 오프셋 표시
  const ind = document.getElementById('sync-indicator');
  showSyncHint('ab', abImgOffset);
}

// ── 이미지 자동 스크롤 ───────────────────────────────────────────
function updateImageSync(ct) {
  let imgIdx = 1;
  for (let i = 0; i < IMAGE_TIMELINE.length; i++) {
    if (ct >= IMAGE_TIMELINE[i]) imgIdx = i + 1;
    else break;
  }
  imgIdx = Math.max(1, Math.min(TOTAL_IMAGES, imgIdx + abImgOffset));
  if (imgIdx === abCurrentImg) return;
  abCurrentImg = imgIdx;

  // 페이지 전환 필요?
  const pageOfImg = Math.ceil(imgIdx / AB_PAGE_SIZE);
  if (pageOfImg !== abPage) {
    abPage = pageOfImg;
    renderAudiobook();
  }

  // 해당 씬으로 스크롤
  const el = document.getElementById('ab-scene-' + imgIdx);
  if (el && !isScrollingToImage) {
    isScrollingToImage = true;
    el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    setTimeout(() => { isScrollingToImage = false; }, 1000);
  }

  document.getElementById('ab-progress').textContent =
    `${imgIdx} / ${TOTAL_IMAGES}`;
}

// ══════════════════════════════════════════════════════════════════
// 엔딩 카드
// ══════════════════════════════════════════════════════════════════
function makeEndingCard(mode) {
  const div = document.createElement('div');
  div.className = 'ending-card';
  div.innerHTML = `
    <span class="ending-paw">🐾</span>
    <div class="ending-title">사랑은 반드시 돌아옵니다</div>
    <div class="ending-sub">오늘, 전화 한 통 드리세요.</div>
    <div class="ending-btns">
      <button class="ending-btn btn-restart"
        onclick="${mode === 'webtoon' ? 'wtPage=1;renderWebtoon()' : 'audio.currentTime=0;abPage=1;renderAudiobook()'}"
      >처음부터 다시 보기</button>
      <button class="ending-btn btn-home-end" onclick="goHome()">모드 선택으로</button>
    </div>`;
  return div;
}

// 저장된 싱크 복원
loadImgSync();

// 초기 히스토리 상태 설정
history.replaceState({screen:'home'}, '');

// 뒤로가기 버튼 처리
window.addEventListener('popstate', function(e) {
  var cur = getCurrentScreen();
  if (cur === 'webtoon' || cur === 'audiobook') {
    history.pushState({screen: cur}, '');
    showBackPopup('홈 화면으로 이동하시겠습니까?', function() { goHome(); });
  } else {
    history.pushState({screen: 'home'}, '');
    showBackPopup('앱을 종료하시겠습니까?', function() {
      history.go(-2);
    });
  }
});
</script>
</body>
</html>
